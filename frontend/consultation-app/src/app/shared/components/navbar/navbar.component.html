<nav class="app-nav">
  <div class="nav-left">
    <a class="logo" routerLink="/home">MediConsult</a>
    <div class="search-inline" role="search">
      <input aria-label="Search doctors" placeholder="Search doctors, specializations..." />
      <button class="btn btn-ghost">Search</button>
    </div>
  </div>

  <div class="nav-right">
    <button class="icon-btn" aria-label="Notifications" title="Notifications">
      <i class="bell" aria-hidden="true"></i>
      <span class="badge" *ngIf="unreadCount &gt; 0">{{ unreadCount }}</span>
    </button>

    <ng-container *ngIf="!isAuthenticated">
      <a class="btn btn-outline" routerLink="/auth/login">Login</a>
      <a class="btn btn-primary" routerLink="/auth/register">Register</a>
    </ng-container>

    <ng-container *ngIf="isAuthenticated">
      <div class="user-menu">
        <button class="avatar-btn">{{ user?.fullName?.split(' ')[0] }}</button>
        <ul class="dropdown">
          <li><a routerLink="/dashboard">Dashboard</a></li>
          <li><a (click)="logout()">Logout</a></li>
        </ul>
      </div>
    </ng-container>
  </div>
</nav>
