<div class="container">

  <div class="header">
    <h2>Notifications</h2>

    <button (click)="markAll()" class="btn-clear">
      Mark All Read
    </button>
  </div>

  <div class="badge">
    Unread: {{ unreadCount }}
  </div>

  <div class="list">

    <div class="card"
         *ngFor="let n of notifications"
         [class.unread]="!n.isRead">

      <div class="content">
        <h4>{{ n.title }}</h4>
        <p>{{ n.message }}</p>
        <small>{{ n.createdAt | date:'short' }}</small>
      </div>

      <button *ngIf="!n.isRead"
              (click)="markRead(n.id)">
        Mark Read
      </button>

    </div>

  </div>

</div>
