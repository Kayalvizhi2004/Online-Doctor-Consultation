<div class="dashboard-shell">
  <aside class="sidebar">
    <ul>
      <li><a routerLink="./overview">Overview</a></li>
      <li><a routerLink="./slots">Slots</a></li>
      <li><a routerLink="./appointments">Appointments</a></li>
      <li><a routerLink="./reviews">Reviews</a></li>
      <li><a routerLink="./profile">Profile</a></li>
    </ul>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title">Doctor Dashboard</div>
      <div class="actions"><button class="btn btn-outline">New Slot</button></div>
    </div>

    <section class="content"><ng-content></ng-content></section>
  </main>
</div>
<div class="dashboard">

  <h2>Doctor Dashboard</h2>

  <div class="grid">

    <div class="card">
      <h3>Total Appointments</h3>
      <p>{{appointments.length}}</p>
    </div>

    <div class="card highlight">
      <h3>Pending</h3>
      <p>{{pending.length}}</p>
    </div>

  </div>

  <div class="section">

    <h3>Appointments</h3>

    <div *ngFor="let a of appointments" class="item">

      <p><b>Patient:</b> {{a.patientName}}</p>
      <p><b>Status:</b> {{a.status}}</p>

      <button (click)="confirm(a.id)">Confirm</button>
      <button (click)="startSession(a.id)">Start</button>
      <button (click)="endSession(a.id)">End</button>

    </div>

  </div>

</div>
