<div class="dashboard">

  <div class="header">
    <h2>Welcome, {{ user?.fullName || 'Patient' }}</h2>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Appointments</h3>
      <p class="big">{{ appointments().length }}</p>
    </div>

    <div class="card highlight">
      <h3>Unread Notifications</h3>
      <p class="big">{{ unreadCount() }}</p>
    </div>
  </div>

  <div class="section">
    <h3>My Appointments</h3>

    <div *ngIf="appointments().length === 0" class="empty">
      <p>No appointments yet.</p>
    </div>

    <div *ngFor="let a of appointments()" class="item">
      <div class="item-main">
        <p class="item-doctor">{{ a.doctorName || 'Doctor' }}</p>
        <p class="item-meta">{{ a.specialization }} · {{ a.date | date: 'MMM dd, yyyy' }} · {{ a.startTime }}</p>
      </div>
      <div class="item-side">
        <span class="status-pill" [attr.data-status]="(a.status || '').toLowerCase()">{{ a.status }}</span>
        <button class="btn btn-primary btn-sm" *ngIf="canJoin(a)" (click)="join(a.sessionId)">Join</button>
      </div>
    </div>
  </div>

</div>
