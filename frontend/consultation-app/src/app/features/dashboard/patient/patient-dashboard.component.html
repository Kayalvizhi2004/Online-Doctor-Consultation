<div class="patient-shell">
  <div class="header">
    <h2>Welcome, {{ user?.fullName }}</h2>
    <div class="quick-search"><input placeholder="Search doctors..." /></div>
  </div>

  <section class="upcoming">
    <h3>Upcoming Appointments</h3>
    <div class="cards">
      <div class="card" *ngFor="let a of appointments">
        <div class="left">Dr. {{ a.doctorName }}</div>
        <div class="right"><button class="btn btn-primary" (click)="join(a.sessionId)" *ngIf="a.canJoin">Join</button></div>
      </div>
    </div>
  </section>
</div>
<div class="dashboard">

  <h2>Patient Dashboard</h2>

  <div class="grid">

    <div class="card">
      <h3>Appointments</h3>
      <p>Total: {{appointments.length}}</p>
    </div>

    <div class="card highlight">
      <h3>Notifications</h3>
      <p>Unread: {{unreadCount}}</p>
    </div>

  </div>

  <div class="section">
    <h3>Upcoming Appointments</h3>

    <div *ngFor="let a of appointments" class="item">
      <p><b>Doctor:</b> {{a.doctorName}}</p>
      <p><b>Status:</b> {{a.status}}</p>
    </div>

  </div>

</div>
