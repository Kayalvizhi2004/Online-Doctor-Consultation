<div class="auth-page">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="muted">Login to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label>Email
        <input formControlName="email" type="email" />
        <small class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">Enter a valid email</small>
      </label>

      <label>Password
        <input formControlName="password" type="password" />
        <small class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">Password is required</small>
      </label>

      <button class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        Login
      </button>
    </form>

    <div class="auth-footer">Don't have an account? <a routerLink="/auth/register">Register</a></div>
  </div>
</div>
