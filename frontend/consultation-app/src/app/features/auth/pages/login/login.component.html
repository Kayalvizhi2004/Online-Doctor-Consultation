<div class="auth-page">

  <div class="auth-card">

    <div class="brand-section">
      

      <h1>Welcome Back</h1>

      <p>
        Sign in to access your healthcare dashboard
      </p>
    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="login-form">

      <!-- Email -->

      <div class="form-group">

        <label>Email Address</label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email address"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          [class.valid]="loginForm.get('email')?.valid" />

        <div class="validation-message"
          *ngIf="loginForm.get('email')?.touched">

          <small
            *ngIf="loginForm.get('email')?.errors?.['required']">
            Email is required
          </small>

          <small
            *ngIf="loginForm.get('email')?.errors?.['email']">
            Please enter a valid email address
          </small>

        </div>

      </div>

      <!-- Password -->

      <div class="form-group">

        <label>Password</label>

        <div class="password-wrapper">

          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            [class.valid]="loginForm.get('password')?.valid" />

          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword">

            {{ showPassword ? 'Hide' : 'Show' }}

          </button>

        </div>

        <div class="validation-message"
          *ngIf="loginForm.get('password')?.touched">

          <small
            *ngIf="loginForm.get('password')?.errors?.['required']">
            Password is required
          </small>

          <small
            *ngIf="loginForm.get('password')?.errors?.['minlength']">
            Password must contain at least 6 characters
          </small>

        </div>

      </div>

      <!-- Server Error -->

      <div
        class="error-alert"
        *ngIf="errorMessage">

        {{ errorMessage }}

      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || isLoading">

        <span *ngIf="isLoading" class="spinner"></span>

        {{ isLoading ? 'Signing In...' : 'Sign In' }}

      </button>

    </form>

    <div class="footer">

      <p>
        Don't have an account?
        <a routerLink="/auth/register">
          Create Account
        </a>
      </p>

    </div>

  </div>

</div>
