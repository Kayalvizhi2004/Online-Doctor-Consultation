<div class="admin-page">
  <div class="page-header">
    <h2>Doctors</h2>
    <p class="muted">Manage doctors, specializations and availability.</p>
  </div>

  <app-admin-table [columns]="columns" [rows]="doctors" [loading]="loading"
    (view)="view($event)" (edit)="edit($event)" (delete)="delete($event)"></app-admin-table>

  <div class="modal-backdrop" *ngIf="showConfirm">
  <div class="modal">

    <h3>Confirmation</h3>

    <p>{{ confirmMessage }}</p>

    <div class="actions">
      <button class="btn btn-danger" (click)="confirmYes()">
        Yes
      </button>

      <button class="btn btn-outline" (click)="confirmNo()">
        No
      </button>
    </div>

  </div>
</div>
  </div>
